<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة تأخر المعلمات</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .settings-panel {
            background: #eef2f5;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        label {
            font-weight: bold;
            color: #34495e;
        }
        input, button {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219150;
        }
        .form-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .alert-row {
            background-color: #ffe6e6 !important;
            color: #c0392b;
            font-weight: bold;
        }
        .badge-alert {
            background-color: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .badge-normal {
            background-color: #2ecc71;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>نظام متابعة وحساب تأخر المعلمات</h2>

    <!-- إعدادات وقت الحضور وحد الحسم -->
    <div class="settings-panel">
        <div class="input-group">
            <label for="officialTime">وقت الحضور الرسمي:</label>
            <input type="time" id="officialTime" value="07:00">
        </div>
        <div class="input-group">
            <label for="deductionLimit">حد الحسم (بالساعات):</label>
            <input type="number" id="deductionLimit" value="7" min="1" style="width: 70px;">
        </div>
    </div>

    <!-- إضافة سجل جديد -->
    <div class="form-panel">
        <input type="text" id="teacherName" placeholder="اسم المعلمة" required>
        <input type="time" id="arrivalTime" required>
        <button onclick="addRecord()">تسجيل الحضور</button>
    </div>

    <!-- جدول البيانات -->
    <table>
        <thead>
            <tr>
                <th>اسم المعلمة</th>
                <th>وقت الحضور</th>
                <th>تأخير اليوم (دقائق)</th>
                <th>مجموع التأخير التراكمي</th>
                <th>الحالة والتنبيه</th>
            </tr>
        </thead>
        <tbody id="attendanceTable">
            <!-- يتم إضافة السجلات هنا تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    // تخزين بيانات المعلمات في الذاكرة
    const teachersData = {};

    function addRecord() {
        const name = document.getElementById('teacherName').value.trim();
        const arrivalTimeStr = document.getElementById('arrivalTime').value;
        const officialTimeStr = document.getElementById('officialTime').value;
        const deductionHours = parseFloat(document.getElementById('deductionLimit').value) || 7;
        const deductionMinutesLimit = deductionHours * 60; // تحويل الساعات إلى دقائق

        if (!name || !arrivalTimeStr) {
            alert('يرجى كتابة اسم المعلمة وتحديد وقت الحضور.');
            return;
        }

        // حساب التأخير لليوم الحالي
        const todayDelay = calculateMinutesDelay(officialTimeStr, arrivalTimeStr);

        // التحديث في قاعدة البيانات المؤقتة
        if (!teachersData[name]) {
            teachersData[name] = 0;
        }
        teachersData[name] += todayDelay;

        const totalDelay = teachersData[name];

        // تحديث أو إضافة السطر في الجدول
        renderTable(name, arrivalTimeStr, todayDelay, totalDelay, deductionMinutesLimit);

        // إعادة ضبط خانة الاسم والوقت
        document.getElementById('teacherName').value = '';
        document.getElementById('arrivalTime').value = '';
    }

    // دالة حساب فرق الدقائق بين وقت الحضور الرسمي والفعلي
    function calculateMinutesDelay(official, arrival) {
        const [offHours, offMins] = official.split(':').map(Number);
        const [arrHours, arrMins] = arrival.split(':').map(Number);

        const officialTotalMins = offHours * 60 + offMins;
        const arrivalTotalMins = arrHours * 60 + arrMins;

        const diff = arrivalTotalMins - officialTotalMins;
        return diff > 0 ? diff : 0; // إذا حضرت مبكرة أو في الوقت لا يحسب تأخير
    }

    // دالة عرض وتحديث السجلات في الجدول
    function renderTable(name, arrivalTime, todayDelay, totalDelay, limitMinutes) {
        const tbody = document.getElementById('attendanceTable');
        
        // التحقق مما إذا كانت المعلمة موجودة مسبقاً في الجدول لتحديث سطرها
        let existingRow = document.getElementById(`row-${name}`);
        
        const isAlert = totalDelay >= limitMinutes;
        const rowClass = isAlert ? 'alert-row' : '';
        const statusBadge = isAlert 
            ? `<span class="badge-alert">تجاوزت حد الحسم (${(totalDelay/60).toFixed(1)} ساعة)</span>` 
            : `<span class="badge-normal">منتظم</span>`;

        if (existingRow) {
            existingRow.className = rowClass;
            existingRow.innerHTML = `
                <td>${name}</td>
                <td>${arrivalTime}</td>
                <td>${todayDelay} دقيقة</td>
                <td>${totalDelay} دقيقة (${(totalDelay/60).toFixed(1)} ساعة)</td>
                <td>${statusBadge}</td>
            `;
        } else {
            const tr = document.createElement('tr');
            tr.id = `row-${name}`;
            tr.className = rowClass;
            tr.innerHTML = `
                <td>${name}</td>
                <td>${arrivalTime}</td>
                <td>${todayDelay} دقيقة</td>
                <td>${totalDelay} دقيقة (${(totalDelay/60).toFixed(1)} ساعة)</td>
                <td>${statusBadge}</td>
            `;
            tbody.appendChild(tr);
        }

        // إظهار تنبيه مسانب إذا تجاوزت المعلمة حد الحسم
        if (isAlert) {
            alert(`تنبيه: المعلمة (${name}) وصلت إلى حد الحسم التراكمي (${(totalDelay/60).toFixed(1)} ساعة)!`);
        }
    }
</script>

</body>
</html>
